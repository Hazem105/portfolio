<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6ff;--surface:#fff;--ink:#0f1535;--muted:#555c7e;--line:#dcdff3;--a1:#5b3df5;--a2:#0891b2;--accent:var(--a1);--accent-ink:#fff;--glow1:rgba(91,61,245,.14);--glow2:rgba(8,145,178,.12);--shadow:0 10px 30px rgba(40,30,120,.10)}
[data-theme="dark"]{--bg:#0a0e22;--surface:#121836;--ink:#eef0ff;--muted:#a3a9cf;--line:#232a52;--a1:#8b6cff;--a2:#22d3ee;--accent:#a590ff;--accent-ink:#0a0e22;--glow1:rgba(139,108,255,.22);--glow2:rgba(34,211,238,.14);--shadow:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(900px 500px at 85% -5%,var(--glow1),transparent 60%),radial-gradient(700px 420px at 0% 12%,var(--glow2),transparent 60%),var(--bg);background-repeat:no-repeat;color:var(--ink);font-family:"Cairo",system-ui,Tahoma,sans-serif;line-height:1.7;transition:background-color .2s,color .2s}
a{color:inherit}
:focus-visible{outline:3px solid var(--a2);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
nav{display:flex;gap:6px;font-size:.95rem}
nav a{text-decoration:none;color:var(--muted);padding:4px 14px;border-radius:999px;transition:background .15s,color .15s}
nav a:hover{color:var(--ink);background:color-mix(in srgb,var(--a1) 14%,transparent)}
.ctrls{display:flex;gap:8px}
.ctrls button{font:inherit;font-size:.85rem;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 16px;cursor:pointer;transition:border-color .15s,transform .15s}
.ctrls button:hover{border-color:var(--a1);transform:translateY(-1px)}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;padding:78px 0 60px}
.hero .role{display:inline-block;margin:0 0 14px;padding:2px 16px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--ink);background:color-mix(in srgb,var(--a2) 16%,transparent);border:1px solid color-mix(in srgb,var(--a2) 45%,transparent)}
.hero h1{font-size:clamp(2.8rem,8vw,5.4rem);line-height:1.08;margin:0 0 18px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(100deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.hero p.lead{font-size:clamp(1.1rem,2.4vw,1.4rem);max-width:28ch;margin:0 0 26px;color:var(--muted)}
.cta{display:inline-block;text-decoration:none;font-weight:700;color:#fff;background:linear-gradient(100deg,var(--a1),var(--a2));padding:10px 26px;border-radius:999px;box-shadow:var(--shadow);transition:transform .15s}
.cta:hover{transform:translateY(-2px)}
.viz{width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.viz .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.viz .bar:nth-child(2){animation-delay:.08s}.viz .bar:nth-child(3){animation-delay:.16s}.viz .bar:nth-child(4){animation-delay:.24s}.viz .bar:nth-child(5){animation-delay:.32s}.viz .bar:nth-child(6){animation-delay:.4s}
@keyframes grow{from{transform:scaleY(0)}}
section{padding:52px 0}
h2{display:flex;align-items:center;gap:12px;font-size:1.6rem;margin:0 0 24px}
h2::before{content:"";width:6px;height:26px;border-radius:3px;background:linear-gradient(var(--a1),var(--a2))}
.about p{max-width:64ch;margin:0 0 12px;font-size:1.05rem}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.tools div{--c:var(--a1);padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;box-shadow:var(--shadow)}
.tools b{display:block;font-size:1.15rem}
.tools span{color:var(--muted);font-size:.92rem}
[data-tool="SQL"]{--c:#a855f7}[data-tool="Python"]{--c:#3b82f6}[data-tool="Excel"]{--c:#10b981}[data-tool="Power BI"]{--c:#f59e0b}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.filters button{font:inherit;font-size:.92rem;font-weight:600;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 18px;cursor:pointer;transition:border-color .15s}
.filters button:hover{border-color:var(--a1)}
.filters button[aria-pressed="true"]{background:linear-gradient(100deg,var(--a1),var(--a2));color:#fff;border-color:transparent}
#projList{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.row{--c:var(--a1);display:flex;flex-direction:column;gap:12px;padding:22px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:16px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.row:hover{transform:translateY(-4px);border-color:var(--c)}
.row .tool{align-self:flex-start;font-weight:700;font-size:.82rem;padding:1px 12px;border-radius:999px;color:color-mix(in srgb,var(--c) 62%,var(--ink));background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.row h3{margin:0 0 4px;font-size:1.22rem;line-height:1.4}
.row p{margin:0;color:var(--muted)}
.row img{display:block;width:100%;border:1px solid var(--line);border-radius:10px;margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tags span{font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:0 9px;color:var(--muted)}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
.links a{font-weight:700;color:var(--accent)}
.contact ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:12px}
.contact a{display:inline-block;padding:10px 24px;border:1px solid var(--line);border-radius:999px;background:var(--surface);text-decoration:none;font-weight:700;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.contact a:hover{transform:translateY(-2px);border-color:var(--a1);color:var(--accent)}
.empty{color:var(--muted)}
footer{padding:28px 0 44px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
@media (max-width:760px){nav{display:none}.hero{grid-template-columns:1fr;padding-top:48px}.viz{max-width:420px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <nav id="nav"></nav>
  <div class="ctrls"><button id="langBtn" type="button"></button><button id="themeBtn" type="button"></button></div>
</div></header>

<main class="wrap">
  <div class="hero">
    <div>
      <p class="role" id="role"></p>
      <h1 id="name"></h1>
      <p class="lead" id="headline"></p>
      <a class="cta" id="cta" href="#projects"></a>
    </div>
    <svg class="viz" viewBox="0 0 360 280" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--a1)"/><stop offset="1" style="stop-color:var(--a2)"/></linearGradient>
      <linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--a2)"/><stop offset="1" style="stop-color:var(--a1)"/></linearGradient></defs>
      <g stroke="var(--line)"><line x1="30" y1="60" x2="335" y2="60"/><line x1="30" y1="110" x2="335" y2="110"/><line x1="30" y1="160" x2="335" y2="160"/><line x1="30" y1="210" x2="335" y2="210"/></g>
      <g fill="url(#g)"><rect class="bar" x="44" y="150" width="34" height="60" rx="6"/><rect class="bar" x="96" y="120" width="34" height="90" rx="6"/><rect class="bar" x="148" y="135" width="34" height="75" rx="6"/><rect class="bar" x="200" y="90" width="34" height="120" rx="6"/><rect class="bar" x="252" y="70" width="34" height="140" rx="6"/><rect class="bar" x="304" y="40" width="34" height="170" rx="6"/></g>
      <polyline points="61,128 113,98 165,112 217,66 269,48 321,24" fill="none" stroke="url(#l)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="30" y1="210" x2="335" y2="210" stroke="var(--muted)"/>
    </svg>
  </div>
  <section id="about" class="about"><h2 data-ui="about"></h2><div id="aboutText"></div></section>
  <section id="tools"><h2 data-ui="tools"></h2><div class="tools" id="toolsList"></div></section>
  <section id="projects"><h2 data-ui="projects"></h2><div class="filters" id="filters"></div><div id="projList"></div></section>
  <section id="contact" class="contact"><h2 data-ui="contact"></h2><ul id="contactList"></ul></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script src="data.js"></script>
<script>
(function(){
  var S = window.SITE;
  var UI = {
    en:{about:"About",tools:"Tools",projects:"Projects",contact:"Contact",all:"All",cta:"View my work",live:"Live dashboard",code:"Code on GitHub",
        lang:"العربية",dark:"Dark",light:"Light",none:"No projects in this category yet.",noc:"Contact links coming soon."},
    ar:{about:"نبذة",tools:"الأدوات",projects:"المشاريع",contact:"تواصل معي",all:"الكل",cta:"شوف شغلي",live:"الداشبورد أونلاين",code:"الكود على GitHub",
        lang:"English",dark:"داكن",light:"فاتح",none:"مفيش مشاريع في القسم ده لسه.",noc:"لينكات التواصل هتضاف قريبًا."}
  };
  var store = {
    get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
    set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  };
  var lang = store.get("lang") || "en";
  var theme = store.get("theme") || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var filter = "all";

  function $(id){return document.getElementById(id)}
  function el(tag, cls, text){var e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e}
  function t(o){return o ? (o[lang] || o.en || "") : ""}
  function link(href, text, newTab){var a=el("a",null,text); a.href=href; if(newTab){a.target="_blank"; a.rel="noopener noreferrer"} return a}

  function render(){
    var u = UI[lang], root = document.documentElement;
    root.lang = lang; root.dir = lang === "ar" ? "rtl" : "ltr"; root.setAttribute("data-theme", theme);
    document.title = t(S.name) + " | " + t(S.role);
    $("role").textContent = t(S.role);
    $("name").textContent = t(S.name);
    $("headline").textContent = t(S.headline); $("cta").textContent = u.cta;
    document.querySelectorAll("[data-ui]").forEach(function(n){n.textContent = u[n.getAttribute("data-ui")]});
    $("langBtn").textContent = u.lang;
    $("themeBtn").textContent = theme === "dark" ? u.light : u.dark;

    var nav = $("nav"); nav.textContent = "";
    ["about","tools","projects","contact"].forEach(function(id){nav.appendChild(link("#"+id, u[id]))});

    var about = $("aboutText"); about.textContent = "";
    (S.about[lang] || S.about.en || []).forEach(function(p){about.appendChild(el("p",null,p))});

    var tl = $("toolsList"); tl.textContent = "";
    S.tools.forEach(function(x){var d=el("div"); d.setAttribute("data-tool",x.name); d.appendChild(el("b",null,x.name)); d.appendChild(el("span",null,t(x.use))); tl.appendChild(d)});

    var names = ["all"]; S.projects.forEach(function(p){if(names.indexOf(p.tool)<0) names.push(p.tool)});
    var fl = $("filters"); fl.textContent = "";
    names.forEach(function(n){
      var b = el("button",null,n==="all"?u.all:n); b.type="button"; b.setAttribute("aria-pressed", String(filter===n));
      b.onclick = function(){filter=n; render()}; fl.appendChild(b);
    });

    var pl = $("projList"); pl.textContent = "";
    var shown = S.projects.filter(function(p){return filter==="all" || p.tool===filter});
    if(!shown.length) pl.appendChild(el("p","empty",u.none));
    shown.forEach(function(p){
      var r = el("article","row"); r.setAttribute("data-tool",p.tool); r.appendChild(el("div","tool",p.tool));
      var body = el("div");
      body.appendChild(el("h3",null,t(p.title)));
      if(p.image){var im=el("img"); im.src=p.image; im.alt=t(p.title); im.loading="lazy"; body.appendChild(im)}
      body.appendChild(el("p",null,t(p.summary)));
      if(p.tags && p.tags.length){var tg=el("div","tags"); p.tags.forEach(function(x){tg.appendChild(el("span",null,x))}); body.appendChild(tg)}
      var ln = el("div","links");
      if(p.live) ln.appendChild(link(p.live,u.live,true));
      if(p.github) ln.appendChild(link(p.github,u.code,true));
      if(ln.children.length) body.appendChild(ln);
      r.appendChild(body); pl.appendChild(r);
    });

    var c = S.contact || {}, cl = $("contactList"); cl.textContent = "";
    var items = [];
    if(c.email) items.push(["Email","mailto:"+c.email,false]);
    if(c.linkedin) items.push(["LinkedIn",c.linkedin,true]);
    if(c.github) items.push(["GitHub",c.github,true]);
    if(c.whatsapp) items.push(["WhatsApp","https://wa.me/"+String(c.whatsapp).replace(/\D/g,""),true]);
    if(!items.length) cl.appendChild(el("li","empty",u.noc));
    items.forEach(function(i){var li=el("li"); li.appendChild(link(i[1],i[0],i[2])); cl.appendChild(li)});

    $("foot").textContent = "© " + new Date().getFullYear() + " " + t(S.name);
  }

  $("langBtn").onclick = function(){lang = lang==="en" ? "ar" : "en"; store.set("lang",lang); render()};
  $("themeBtn").onclick = function(){theme = theme==="dark" ? "light" : "dark"; store.set("theme",theme); render()};
  render();
})();
</script>
</body>
</html>
